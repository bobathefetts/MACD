experiment:
  name: "summarization_experiment"
  description: "Summarization task experiment"
  seed: 42
  output_dir: "outputs"
  log_level: "INFO"
  use_wandb: false
  save_checkpoints: true
  checkpoint_interval: 10
  max_cycles: 10
  early_stopping_patience: 5
  improvement_threshold: 0.001

task:
  name: "summarization_task"
  type: "summarization"
  data:
    eval_path: "data/summarization/dev.jsonl"
  evaluator:
    rouge_weight: 0.4
    bleu_weight: 0.3
    f1_weight: 0.3

model:
  name: "mock_model"
  backend: "mock"
  params:
    device: "cpu"
    seed: 42
    deterministic: true

evolution:
  population_size: 8
  elite_size: 3
  tournament_size: 3
  mutation_rate: 0.1
  crossover_rate: 0.8
  selection_method: "tournament"
  mutation_type: "gaussian"
  adaptive_mutation: true
  diversity_threshold: 0.1
  max_generations: 100
  convergence_threshold: 0.000001
  convergence_window: 10

distillation:
  base_model_path: "microsoft/DialoGPT-small"
  output_dir: "distilled_models"
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules: ["q_proj", "v_proj"]
  learning_rate: 0.0001
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  warmup_steps: 100
  max_length: 512
  use_quantization: false
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
