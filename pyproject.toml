[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macd"
version = "3.1.0"
description = "MACD v3 - Meta-Adaptive Context Distillation: evolve prompting strategies, then distill the winners into LoRA adapters."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bobathefetts" }]
keywords = ["meta-learning", "lora", "peft", "distillation", "evolutionary-search", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
# In-process Hugging Face backend with LoRA training
hf = [
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
  "accelerate>=1.0",
]
# 4-bit (QLoRA-style) loading; Linux/Windows with an NVIDIA GPU
quant = ["bitsandbytes>=0.44"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
macd = "macd.main:app"

[tool.hatch.build.targets.wheel]
packages = ["macd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
